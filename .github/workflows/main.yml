      - name: Auto-Fix Android Build Errors
        if: steps.first_build.outcome == 'failure'
        working-directory: build-src
        run: |
          echo "===== AUTO-FIX START ====="

          # Fix known KSP CI issue
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/2\.3\.5/2.3.6/g' gradle/libs.versions.toml
            echo "KSP Auto-Fix: 2.3.5 -> 2.3.6"
          fi

          # Fix missing Android debug keystore
          if [ ! -f debug.keystore ]; then
            echo "debug.keystore missing - generating it..."

            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore created successfully."
          else
            echo "debug.keystore already exists."
          fi

          ./gradlew --stop || true

          echo "===== AUTO-FIX COMPLETE ====="
