      - name: Auto-Fix Supabase Upload 400
        working-directory: build-src
        run: |
          echo "===== SUPABASE UPLOAD 400 AUTO-FIX ====="

          FILE="app/src/main/java/com/aistudio/cinenova/app/data/remote/SupabaseStorage.kt"

          if [ -f "$FILE" ]; then
            sed -i '/\.addHeader("x-upsert", "true")/d' "$FILE"
            echo "Upload 400 fix applied: x-upsert removed."
          else
            echo "SupabaseStorage.kt not found."
          fi

          echo "===== UPLOAD 400 AUTO-FIX COMPLETE ====="
