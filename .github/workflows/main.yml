name: CineNova Auto-Fix APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cinenova-auto-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-fix-and-build:

    name: CineNova Auto-Fix + APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. FIND SOURCE ZIP
      # ============================================================

      - name: Find CineNova source ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CineNova Auto-Fix"
          echo "Searching for source ZIP..."
          echo "=========================================="

          if [ -f "cinenova-APK-ready-fixed.zip" ]; then
            echo "SOURCE_ZIP=cinenova-APK-ready-fixed.zip" >> "$GITHUB_ENV"
            echo "Found expected ZIP."
            exit 0
          fi

          FOUND="$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            | head -n 1 || true)"

          if [ -z "$FOUND" ]; then
            echo "ERROR: No ZIP file found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -n 200
            exit 1
          fi

          echo "SOURCE_ZIP=$FOUND" >> "$GITHUB_ENV"
          echo "Using ZIP: $FOUND"

      # ============================================================
      # 3. JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 4. EXTRACT PROJECT
      # ============================================================

      - name: Extract CineNova project
        shell: bash
        run: |
          set -e

          rm -rf build-src
          mkdir -p build-src

          unzip -q "$SOURCE_ZIP" -d build-src

          echo "Extracted files:"
          find build-src -maxdepth 3 -type f | head -n 150

          # Handle ZIP with an extra top-level directory
          if [ ! -f "build-src/gradlew" ]; then

            FOUND="$(find build-src -maxdepth 4 -type f -name gradlew | head -n 1 || true)"

            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(dirname "$FOUND")"

              echo "Nested Android project detected:"
              echo "$PROJECT_DIR"

              mkdir -p build-normalized

              cp -a "$PROJECT_DIR"/. build-normalized/

              rm -rf build-src
              mv build-normalized build-src
            fi
          fi

          test -f build-src/gradlew || {
            echo "ERROR: gradlew not found."
            find build-src -maxdepth 5 -type f | head -n 300
            exit 1
          }

          chmod +x build-src/gradlew

      # ============================================================
      # 5. BACKUP ORIGINAL SOURCE
      # ============================================================

      - name: Backup source before Auto-Fix
        shell: bash
        run: |
          set -e

          cp -a build-src build-src-before-autofix

          echo "Original source backed up."

      # ============================================================
      # 6. AUTOMATIC VIDEO PLAYBACK FIX
      # ============================================================

      - name: Auto-Fix video playback and persistence
        shell: bash
        run: |
          set -e

          cd build-src

          echo "=========================================="
          echo "CineNova VIDEO AUTO-FIX"
          echo "=========================================="

          python3 <<'PY'
          import os
          import re
          import pathlib
          import shutil

          ROOT = pathlib.Path(".")

          TEXT_EXTENSIONS = {
              ".js",
              ".jsx",
              ".ts",
              ".tsx",
              ".html",
              ".css",
              ".java",
              ".kt",
              ".xml"
          }

          files_changed = []

          def read_text(path):
              try:
                  return path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  return None

          def write_text(path, text):
              path.write_text(
                  text,
                  encoding="utf-8"
              )

          def is_source(path):
              if not path.is_file():
                  return False

              if path.suffix.lower() not in TEXT_EXTENSIONS:
                  return False

              bad = {
                  "node_modules",
                  ".gradle",
                  "build",
                  ".git"
              }

              return not any(x in path.parts for x in bad)

          # --------------------------------------------------------
          # Scan source
          # --------------------------------------------------------

          source_files = []

          for path in ROOT.rglob("*"):
              if is_source(path):
                  source_files.append(path)

          print(f"Found {len(source_files)} source files.")

          # --------------------------------------------------------
          # Fix 1:
          # Prevent permanent storage of blob/object URLs
          # --------------------------------------------------------

          BLOB_CHECK = re.compile(
              r"(blob:|URL\.createObjectURL)",
              re.IGNORECASE
          )

          for path in source_files:

              text = read_text(path)

              if text is None:
                  continue

              original = text

              # Add helper only when video URL handling exists.
              if (
                  "video" in text.lower()
                  and (
                      "createObjectURL" in text
                      or "blob:" in text
                  )
              ):

                  helper = r'''
          // ========================================================
          // CineNova Safe Video URL Helper
          // ========================================================

          function cineNovaIsPlayableUrl(value) {
            if (!value || typeof value !== "string") return false;

            const url = value.trim();

            if (!url) return false;

            // Blob URLs are temporary and MUST NOT be saved
            // as permanent video URLs.
            if (url.startsWith("blob:")) return false;

            if (url.startsWith("data:")) return false;

            return (
              url.startsWith("http://") ||
              url.startsWith("https://")
            );
          }

          function cineNovaSafeVideoUrl(value) {
            return cineNovaIsPlayableUrl(value)
              ? value.trim()
              : "";
          }

          '''

                  if "function cineNovaIsPlayableUrl" not in text:
                      text = helper + text

              if text != original:
                  write_text(path, text)
                  files_changed.append(str(path))

          # --------------------------------------------------------
          # Fix 2:
          # Detect React video components and add safer attributes
          # --------------------------------------------------------

          for path in source_files:

              text = read_text(path)

              if text is None:
                  continue

              original = text

              if (
                  path.suffix.lower()
                  in {".js", ".jsx", ".ts", ".tsx"}
                  and "<video" in text
              ):

                  # Avoid duplicate attributes.
                  text = re.sub(
                      r'<video([^>]*?)>',
                      lambda m:
                          "<video" +
                          m.group(1) +
                          (
                              ""
                              if "playsInline" in m.group(1)
                              else " playsInline"
                          ) +
                          (
                              ""
                              if "preload=" in m.group(1)
                              else ' preload="metadata"'
                          ) +
                          ">",
                      text,
                      flags=re.IGNORECASE
                  )

              if text != original:
                  write_text(path, text)
                  files_changed.append(str(path))

          # --------------------------------------------------------
          # Fix 3:
          # Detect HTML video elements
          # --------------------------------------------------------

          for path in source_files:

              text = read_text(path)

              if text is None:
                  continue

              original = text

              if path.suffix.lower() == ".html":

                  text = re.sub(
                      r'<video([^>]*?)>',
                      lambda m:
                          "<video" +
                          m.group(1) +
                          (
                              ""
                              if re.search(
                                  r"\bplaysinline\b",
                                  m.group(1),
                                  re.I
                              )
                              else " playsinline"
                          ) +
                          (
                              ""
                              if re.search(
                                  r"\bpreload\s*=",
                                  m.group(1),
                                  re.I
                              )
                              else ' preload="metadata"'
                          ) +
                          ">",
                      text,
                      flags=re.IGNORECASE
                  )

              if text != original:
                  write_text(path, text)
                  files_changed.append(str(path))

          # --------------------------------------------------------
          # Fix 4:
          # Remove dangerous interval-based Firestore writes
          # when obvious 500ms playback writes are present.
          # --------------------------------------------------------

          for path in source_files:

              text = read_text(path)

              if text is None:
                  continue

              original = text

              # This only removes extremely obvious 500ms database
              # write loops. It does NOT blindly remove normal
              # intervals.
              pattern = re.compile(
                  r"setInterval\s*\(\s*[^;]{0,1200}"
                  r"(firestore|firebase|updateDoc|setDoc|addDoc)"
                  r"[^;]{0,2000}?,\s*500\s*\)",
                  re.I | re.S
              )

              if pattern.search(text):

                  text = pattern.sub(
                      "// CineNova Auto-Fix: removed high-frequency "
                      "database write loop during video playback.",
                      text
                  )

              if text != original:
                  write_text(path, text)
                  files_changed.append(str(path))

          # --------------------------------------------------------
          # Fix 5:
          # Add a global safe media error handler for browser/web app
          # --------------------------------------------------------

          for path in source_files:

              text = read_text(path)

              if text is None:
                  continue

              original = text

              if (
                  path.suffix.lower() in {".js", ".jsx", ".ts", ".tsx"}
                  and (
                      "<video" in text
                      or "HTMLVideoElement" in text
                      or ".play()" in text
                  )
              ):

                  if "cineNovaMediaErrorHandler" not in text:

                      helper = r'''
          // ========================================================
          // CineNova Media Safety Layer
          // ========================================================

          function cineNovaMediaErrorHandler(error) {
            try {
              console.warn(
                "CineNova video playback error:",
                error
              );
            } catch (_) {}

            return false;
          }

          function cineNovaSafePlay(video) {
            if (!video) return Promise.resolve(false);

            try {
              const result = video.play();

              if (result && typeof result.catch === "function") {
                return result
                  .then(() => true)
                  .catch((error) => {
                    cineNovaMediaErrorHandler(error);
                    return false;
                  });
              }

              return Promise.resolve(true);

            } catch (error) {
              cineNovaMediaErrorHandler(error);
              return Promise.resolve(false);
            }
          }

          '''

                      text = helper + text

              if text != original:
                  write_text(path, text)
                  files_changed.append(str(path))

          # --------------------------------------------------------
          # Remove duplicate list entries
          # --------------------------------------------------------

          files_changed = sorted(set(files_changed))

          print("")
          print("==========================================")
          print("AUTO-FIX RESULT")
          print("==========================================")

          if files_changed:
              print("Files changed:")

              for f in files_changed:
                  print("  FIXED:", f)

          else:
              print("No source file required automatic modification.")

          print("==========================================")
          PY

      # ============================================================
      # 7. VERIFY SOURCE
      # ============================================================

      - name: Verify Auto-Fix source
        shell: bash
        run: |
          set -e

          cd build-src

          echo "Checking Gradle project..."

          test -f gradlew

          chmod +x gradlew

          if [ -f settings.gradle ]; then
            echo "settings.gradle found"
          fi

          if [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts found"
          fi

          if [ -d app ]; then
            echo "Android app module found"
          else
            echo "WARNING: app directory not found."
            find . -maxdepth 3 -type d | head -n 100
          fi

      # ============================================================
      # 8. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: build-src
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 9. BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        working-directory: build-src
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 10. FIND APK
      # ============================================================

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find build-src \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find build-src \
            -type f \
            -name "*-debug.apk" \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            APK="$(find build-src \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK found:"
          ls -lh "$APK"

      # ============================================================
      # 11. CREATE FIXED ZIP
      # ============================================================

      - name: Create Auto-Fixed Project ZIP
        shell: bash
        run: |
          set -e

          rm -f cinenova-APK-ready-fixed-AUTOFIXED.zip

          cd build-src

          zip -qr \
            ../cinenova-APK-ready-fixed-AUTOFIXED.zip \
            . \
            -x "*.gradle/*" \
            -x "**/build/*" \
            -x "**/.gradle/*"

          cd ..

          ls -lh cinenova-APK-ready-fixed-AUTOFIXED.zip

      # ============================================================
      # 12. UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineNova-AutoFix-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 13. UPLOAD FIXED PROJECT ZIP
      # ============================================================

      - name: Upload Auto-Fixed Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CineNova-AutoFix-Project
          path: cinenova-APK-ready-fixed-AUTOFIXED.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 14. SAVE FIXED SOURCE BACK TO REPOSITORY
      # ============================================================

      - name: Commit Auto-Fix changes
        shell: bash
        run: |
          set -e

          # Do not fail if no source changes were necessary.
          if [ ! -d build-src ]; then
            echo "build-src missing."
            exit 0
          fi

          echo "Checking Git status..."

          git status --short

          # The source project is stored inside the ZIP in the repo.
          # The workflow artifact is the primary output.
          #
          # We intentionally do NOT overwrite the original ZIP here,
          # because an automatic commit should not destroy the user's
          # original project backup.

          echo "Auto-Fix completed successfully."

      # ============================================================
      # 15. FINAL SUMMARY
      # ============================================================

      - name: CineNova Auto-Fix Summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       CINENOVA AUTO-FIX FINISHED"
          echo "=============================================="
          echo ""
          echo "The workflow attempted to:"
          echo ""
          echo "1. Extract the CineNova project"
          echo "2. Detect video playback code"
          echo "3. Protect against temporary blob URLs"
          echo "4. Add safer video playback attributes"
          echo "5. Protect video.play() failures"
          echo "6. Detect dangerous high-frequency database writes"
          echo "7. Clean the Android project"
          echo "8. Build the Debug APK"
          echo "9. Create an Auto-Fixed project ZIP"
          echo ""
          echo "Download the APK from:"
          echo "Actions -> this workflow run -> Artifacts"
          echo ""
          echo "=============================================="
