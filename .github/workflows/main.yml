name: Build CineNova APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract CineNova ZIP
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q cinenova-APK-ready-fixed.zip -d build-src

      - name: Make Gradle executable
        run: chmod +x build-src/gradlew

      - name: Build Debug APK
        working-directory: build-src
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineNova-APK
          path: build-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
