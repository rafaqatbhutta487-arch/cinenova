name: CineNova Auto-Fix APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cinenova-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CineNova APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          set -e
          test -f cinenova-APK-ready-fixed.zip || {
            echo "ERROR: cinenova-APK-ready-fixed.zip not found in repository root."
            exit 1
          }
          echo "Source ZIP found:"
          ls -lh cinenova-APK-ready-fixed.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract CineNova project
        shell: bash
        run: |
          set -e
          rm -rf build-src
          mkdir -p build-src

          unzip -q cinenova-APK-ready-fixed.zip -d build-src

          # Support ZIPs that contain one extra top-level folder.
          if [ ! -f build-src/gradlew ]; then
            FOUND="$(find build-src -maxdepth 3 -type f -name gradlew | head -n 1 || true)"
            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(dirname "$FOUND")"
              echo "Nested project detected: $PROJECT_DIR"
              shopt -s dotglob
              cp -a "$PROJECT_DIR"/. build-src/
            fi
          fi

          test -f build-src/gradlew || {
            echo "ERROR: gradlew was not found after extracting the ZIP."
            find build-src -maxdepth 3 -type f | sort | head -200
            exit 1
          }

          test -d build-src/app || {
            echo "ERROR: Android app module 'app' was not found."
            exit 1
          }

          echo "Project extracted successfully."
          ls -la build-src

      - name: Make Gradle executable
        run: chmod +x build-src/gradlew

      - name: Auto-Fix CineNova source and build configuration
        working-directory: build-src
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        CINENOVA AUTO-FIX START"
          echo "========================================"

          STORAGE_FILE="app/src/main/java/com/aistudio/cinenova/app/data/remote/SupabaseStorage.kt"
          VERSION_FILE="gradle/libs.versions.toml"
          GRADLE_PROPERTIES="gradle.properties"

          # ------------------------------------------------------------
          # FIX 1: Supabase upload HTTP 400
          # The app creates a new UUID path for every video, so upsert is
          # unnecessary. Removing x-upsert also avoids requiring UPDATE/
          # SELECT policies for overwrite operations.
          # ------------------------------------------------------------
          if [ -f "$STORAGE_FILE" ]; then
            sed -i '/\.addHeader("x-upsert", "true")/d' "$STORAGE_FILE"
            echo "FIX 1 OK: removed Supabase x-upsert header."
          else
            echo "FIX 1 SKIP: SupabaseStorage.kt not found."
          fi

          # ------------------------------------------------------------
          # FIX 2: KSP CI crash (known 2.3.5 issue -> 2.3.6)
          # ------------------------------------------------------------
          if [ -f "$VERSION_FILE" ]; then
            sed -i 's/2\.3\.5/2.3.6/g' "$VERSION_FILE"
            echo "FIX 2 OK: KSP 2.3.5 -> 2.3.6."
          fi

          # ------------------------------------------------------------
          # FIX 3: Ensure common Gradle/Android properties exist.
          # Existing values are preserved.
          # ------------------------------------------------------------
          touch "$GRADLE_PROPERTIES"

          grep -q '^org.gradle.jvmargs=' "$GRADLE_PROPERTIES" || \
            echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' >> "$GRADLE_PROPERTIES"

          grep -q '^android.useAndroidX=' "$GRADLE_PROPERTIES" || \
            echo 'android.useAndroidX=true' >> "$GRADLE_PROPERTIES"

          grep -q '^android.nonTransitiveRClass=' "$GRADLE_PROPERTIES" || \
            echo 'android.nonTransitiveRClass=false' >> "$GRADLE_PROPERTIES"

          echo "FIX 3 OK: Gradle/Android properties checked."

          # ------------------------------------------------------------
          # FIX 4: Generate debug keystore if project does not have one.
          # Android debug builds can then be installed/tested.
          # ------------------------------------------------------------
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "FIX 4 OK: debug.keystore generated."
          else
            echo "FIX 4 OK: debug.keystore already exists."
          fi

          # ------------------------------------------------------------
          # FIX 5: Stop stale Gradle daemons before building.
          # ------------------------------------------------------------
          ./gradlew --stop || true
          echo "FIX 5 OK: Gradle daemons stopped."

          echo "========================================"
          echo "         CINENOVA AUTO-FIX DONE"
          echo "========================================"

      - name: Verify important project files
        working-directory: build-src
        shell: bash
        run: |
          set -e
          test -f gradlew
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app

          echo "Gradle wrapper:"
          ./gradlew --version

          echo "Checking KSP version:"
          grep -n "googleDevtoolsKsp" gradle/libs.versions.toml || true

          echo "Checking Supabase upsert header:"
          if grep -R 'x-upsert.*true' app/src/main/java 2>/dev/null; then
            echo "WARNING: x-upsert is still present somewhere."
          else
            echo "OK: x-upsert header is not present."
          fi

      - name: First build attempt
        id: first_build
        continue-on-error: true
        working-directory: build-src
        shell: bash
        run: |
          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Auto-Fix after build failure
        if: steps.first_build.outcome == 'failure'
        working-directory: build-src
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "     SECONDARY BUILD AUTO-FIX START"
          echo "========================================"

          VERSION_FILE="gradle/libs.versions.toml"

          # Re-apply known KSP CI fix in case the project regenerated or
          # another step changed the version.
          if [ -f "$VERSION_FILE" ]; then
            sed -i 's/2\.3\.5/2.3.6/g' "$VERSION_FILE"
          fi

          # Re-apply the Supabase upload fix.
          STORAGE_FILE="app/src/main/java/com/aistudio/cinenova/app/data/remote/SupabaseStorage.kt"
          if [ -f "$STORAGE_FILE" ]; then
            sed -i '/\.addHeader("x-upsert", "true")/d' "$STORAGE_FILE"
          fi

          ./gradlew --stop || true
          rm -rf .gradle
          echo "Secondary auto-fix completed."

      - name: Second build attempt
        if: steps.first_build.outcome == 'failure'
        working-directory: build-src
        shell: bash
        run: |
          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_COUNT="$(find build-src -type f -name '*.apk' | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            echo "Searching build output:"
            find build-src -maxdepth 8 -type f \( -name '*.log' -o -name '*.apk' \) -print || true
            exit 1
          fi

          echo "APK files generated:"
          find build-src -type f -name '*.apk' -print -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineNova-APK
          path: build-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "========================================"
          echo "          CINENOVA BUILD SUMMARY"
          echo "========================================"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run:      ${{ github.run_number }}"
          echo "Commit:   ${{ github.sha }}"
          echo "========================================"
